name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/RateLimiting.Tests -c Release

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish the Blazor app
        run: dotnet publish src/RateLimiting.Playground -c Release -o out
      - name: Point the app at its GitHub Pages path
        run: |
          sed -i 's|<base href="/" />|<base href="/api-rate-limiter-dotnet/" />|' out/wwwroot/index.html
          touch out/wwwroot/.nojekyll
          cp out/wwwroot/index.html out/wwwroot/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot
      - id: deployment
        uses: actions/deploy-pages@v4
